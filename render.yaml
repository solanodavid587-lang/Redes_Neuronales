envVarGroups:
  - name: neurolab-shared
    envVars:
      - key: WORKER_API_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

services:
  - type: web
    name: neurolab-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: neurolab-shared
      - key: APP_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_DATASET_REPO_ID
        sync: false
      - key: GH_ACTIONS_TOKEN
        sync: false
      - key: GH_ACTIONS_REPOSITORY
        value: solanodavid587-lang/Redes_Neuronales
