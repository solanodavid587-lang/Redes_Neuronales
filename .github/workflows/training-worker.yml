name: Train NeuroLab model

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Training job ID to process
        required: true
        type: string

concurrency:
  group: neurolab-training-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEUROLAB_API_URL: ${{ vars.NEUROLAB_API_URL }}
      WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
      TRAINING_JOB_ID: ${{ inputs.job_id }}
      PERSIST_ARTIFACTS_VIA_API: "true"
    steps:
      - name: Validate worker configuration
        shell: bash
        run: |
          test -n "$NEUROLAB_API_URL" || { echo "Configure the NEUROLAB_API_URL repository variable."; exit 1; }
          test -n "$WORKER_API_KEY" || { echo "Configure the WORKER_API_KEY repository secret."; exit 1; }
          test -n "$TRAINING_JOB_ID" || { echo "A training job ID is required."; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/pyproject.toml

      - name: Install worker and TensorFlow
        working-directory: workers
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Run training job
        working-directory: workers
        run: python -m training.main
