[project]
name = "neurolab-api"
version = "1.0.0"
description = "NeuroLab Enterprise API"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "PyJWT[crypto]>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
